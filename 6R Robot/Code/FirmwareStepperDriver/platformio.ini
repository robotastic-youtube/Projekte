; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32G431CB]
platform = ststm32
board = genericSTM32G431CB
framework = arduino
build_flags = 
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-DHAL_FDCAN_MODULE_ENABLED
	-DUSE_FULL_LL_DRIVER
	-DUSE_HAL_DRIVER
upload_protocol = dfu
upload_flags = -a 0
	-s 0x08000000:leave
monitor_speed = 115200
lib_deps = 
	https://github.com/simplefoc/Arduino-FOC.git#master
	https://github.com/simplefoc/Arduino-FOC-drivers.git#master

[platformio]
description = Firmware for the FOC-Stepper-Driver Board
